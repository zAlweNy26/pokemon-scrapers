name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Explicit, so steps get pipefail: without it a failed wrangler query piped into jq passes.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The first deploy creates the D1 database and writes its id to void.lock.json.
      # Run it locally and commit the lock, or every CI run would provision a new one.
      # Only `resolved` gets the real id; `source` mirrors void.config.ts's 'local' placeholder.
      - name: Require a committed first deploy
        run: |
          if ! jq -e '.resolved.d1_databases | all(.database_id != "local")' void.lock.json >/dev/null; then
            echo "::error::void.lock.json has no D1 id yet. Run 'bun run deploy' locally once and commit void.lock.json."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck

      # DATA_VERSION is baked into the deploy: announcing a version whose rows are not
      # loaded caches old rows under it for a week. CI can't load data (dataset.sql is
      # built locally and never committed: the repo is public), so it checks what
      # the pre-push hook (or `data:load:remote`) recorded: the same
      # version, and at least a minute ago so read replicas have caught up.
      - name: Require the dataset to be loaded
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID=$(jq -r .resolved.account_id void.lock.json)
          want=$(jq -r .version data/version.json)
          # A failed query stops the step here, not as a false mismatch. With --json,
          # wrangler prints its error on stdout, so show it instead of piping it to jq.
          out=$(bunx wrangler d1 execute "$(jq -r '.resolved.d1_databases[0].database_id' void.lock.json)" --remote --json \
            --command "SELECT (SELECT value FROM meta WHERE key = 'data_version') AS have,
                              (SELECT unixepoch('now') - unixepoch(value) FROM meta WHERE key = 'loaded_at') AS age") \
            || { echo "::error::Could not read the dataset version from D1:"; echo "$out"; exit 1; }
          loaded=$(jq -r '.[0].results[0] | "\(.have) \(.age // 0)"' <<< "$out")
          read -r have age <<< "$loaded"
          if [ "$have" != "$want" ]; then
            echo "::error::Production holds dataset $have, but data/version.json is $want. Push with the pre-push hook on (bun install sets it), or run 'bun run data:load:remote' and re-run this workflow."
            exit 1
          fi
          if [ "$age" -lt 60 ]; then sleep $((60 - age)); fi

      # Applies pending D1 migrations, then uploads the Worker.
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
